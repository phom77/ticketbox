name: ticketbox
services:
  gateway:
    image: ticketbox-web:local
    build: ./frontend
    ports:
    - ${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-18091}:80
    volumes:
    - ./infra/nginx/gateway.conf:/etc/nginx/nginx.conf:ro
    depends_on:
    - identity
    - catalog
    - ticketing
    - checkin
    - payment
    - notification
  payment:
    image: ticketbox-payment:local
    build: ./services/payment
    cpus: 1
    mem_limit: 768m
    stop_grace_period: 30s
    environment:
      PAYMENT_DATABASE_URL: jdbc:postgresql://payment-db:5432/ticketbox_payments
      PAYMENT_DATABASE_USER: payment_owner
      PAYMENT_DATABASE_PASSWORD: payment-local-only
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:-ticketbox-local-payment-service-token-change-before-deploy}
      CORE_API_URL: http://ticketing:8080
      PAYMENT_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:18091}
      SPRING_PROFILES_ACTIVE: dev
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      MOMO_API_ENDPOINT: ${MOMO_API_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      MOMO_RETURN_URL: ${MOMO_RETURN_URL:-http://localhost:18091/payment/result}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-http://localhost:18091/api/payments/webhooks/momo}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:18091/payment/result}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-http://localhost:18091/api/payments/webhooks/vnpay}
      VNPAY_QUERY_URL: ${VNPAY_QUERY_URL:-}
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx512m
    depends_on:
      payment-db:
        condition: service_healthy
  notification:
    image: ticketbox-notification:local
    build: ./services/notification
    cpus: 1
    mem_limit: 768m
    stop_grace_period: 30s
    environment:
      NOTIFICATION_DATABASE_URL: jdbc:postgresql://notification-db:5432/ticketbox_notifications
      NOTIFICATION_DATABASE_USER: notification_owner
      NOTIFICATION_DATABASE_PASSWORD: notification-local-only
      CORE_API_URL: http://ticketing:8080
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:-ticketbox-local-notification-service-token-change-before-deploy}
      JWT_SECRET: ${JWT_SECRET:-ticketbox-local-demo-secret-at-least-sixty-four-characters-change-before-deploy}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ticketbox_local
      RABBITMQ_PASSWORD: broker-local-only
      MAIL_HOST: smtp
      MAIL_PORT: 1025
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx512m
      IDENTITY_API_URL: http://identity:8080
      SPLIT_SERVICE_TOKEN: ${SPLIT_SERVICE_TOKEN:-ticketbox-local-split-service-token-change-before-deploy}
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      smtp:
        condition: service_started
  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketbox_payments
      POSTGRES_USER: payment_owner
      POSTGRES_PASSWORD: payment-local-only
    volumes:
    - payment_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U payment_owner -d ticketbox_payments
      interval: 2s
      retries: 30
  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketbox_notifications
      POSTGRES_USER: notification_owner
      POSTGRES_PASSWORD: notification-local-only
    volumes:
    - notification_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U notification_owner -d ticketbox_notifications
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --maxmemory-policy
    - noeviction
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 2s
      retries: 30
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ticketbox_local
      RABBITMQ_DEFAULT_PASS: broker-local-only
    volumes:
    - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      retries: 30
  smtp:
    image: node:24-alpine
    command:
    - node
    - /app/server.cjs
    volumes:
    - ./infra/smtp/server.cjs:/app/server.cjs:ro
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles:
    - monitoring
    volumes:
    - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
    - 127.0.0.1:9090:9090
    depends_on:
    - identity
    - catalog
    - ticketing
    - checkin
  grafana:
    image: grafana/grafana:11.1.0
    profiles:
    - monitoring
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-ticketbox-local}
    volumes:
    - grafana_data:/var/lib/grafana
    - ./infra/monitoring/grafana:/etc/grafana/provisioning:ro
    ports:
    - 127.0.0.1:3000:3000
    depends_on:
    - prometheus
  identity:
    image: ticketbox-identity:local
    build: ./services/identity
    cpus: 2
    mem_limit: 1200m
    stop_grace_period: 30s
    environment:
      DATABASE_URL: jdbc:postgresql://identity-db:5432/ticketbox_identity
      DATABASE_USER: identity_runtime
      DATABASE_PASSWORD: identity-runtime-local-only
      DATABASE_OWNER: identity_owner
      DATABASE_OWNER_PASSWORD: identity-owner-local-only
      JWT_SECRET: ${JWT_SECRET:-ticketbox-local-demo-secret-at-least-sixty-four-characters-change-before-deploy}
      SPLIT_SERVICE_TOKEN: ${SPLIT_SERVICE_TOKEN:-ticketbox-local-split-service-token-change-before-deploy}
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:-ticketbox-local-payment-service-token-change-before-deploy}
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:-ticketbox-local-notification-service-token-change-before-deploy}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:18091,http://127.0.0.1:18091}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m
      ARTIST_BIO_AI_PROVIDER: ${ARTIST_BIO_AI_PROVIDER:-mock}
      ARTIST_BIO_AI_API_KEY: ${ARTIST_BIO_AI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      identity-db:
        condition: service_healthy
  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketbox_identity
      POSTGRES_USER: identity_owner
      POSTGRES_PASSWORD: identity-owner-local-only
    volumes:
    - identity_data:/var/lib/postgresql/data
    - ./infra/postgres/identity-init.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U identity_owner -d ticketbox_identity
      interval: 2s
      retries: 30
  catalog:
    image: ticketbox-catalog:local
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    cpus: 2
    mem_limit: 1200m
    stop_grace_period: 30s
    environment:
      DATABASE_URL: jdbc:postgresql://catalog-db:5432/ticketbox_catalog
      DATABASE_USER: catalog_runtime
      DATABASE_PASSWORD: catalog-runtime-local-only
      DATABASE_OWNER: catalog_owner
      DATABASE_OWNER_PASSWORD: catalog-owner-local-only
      JWT_SECRET: ${JWT_SECRET:-ticketbox-local-demo-secret-at-least-sixty-four-characters-change-before-deploy}
      SPLIT_SERVICE_TOKEN: ${SPLIT_SERVICE_TOKEN:-ticketbox-local-split-service-token-change-before-deploy}
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:-ticketbox-local-payment-service-token-change-before-deploy}
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:-ticketbox-local-notification-service-token-change-before-deploy}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:18091,http://127.0.0.1:18091}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m
      ARTIST_BIO_AI_PROVIDER: ${ARTIST_BIO_AI_PROVIDER:-mock}
      ARTIST_BIO_AI_API_KEY: ${ARTIST_BIO_AI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      catalog-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
    - catalog_artifacts:/app/data
  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketbox_catalog
      POSTGRES_USER: catalog_owner
      POSTGRES_PASSWORD: catalog-owner-local-only
    volumes:
    - catalog_data:/var/lib/postgresql/data
    - ./infra/postgres/catalog-init.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U catalog_owner -d ticketbox_catalog
      interval: 2s
      retries: 30
  ticketing:
    image: ticketbox-ticketing:local
    build:
      context: .
      dockerfile: services/ticketing/Dockerfile
    cpus: 2
    mem_limit: 1200m
    stop_grace_period: 30s
    environment:
      DATABASE_URL: jdbc:postgresql://ticketing-db:5432/ticketbox_ticketing
      DATABASE_USER: ticketing_runtime
      DATABASE_PASSWORD: ticketing-runtime-local-only
      DATABASE_OWNER: ticketing_owner
      DATABASE_OWNER_PASSWORD: ticketing-owner-local-only
      JWT_SECRET: ${JWT_SECRET:-ticketbox-local-demo-secret-at-least-sixty-four-characters-change-before-deploy}
      SPLIT_SERVICE_TOKEN: ${SPLIT_SERVICE_TOKEN:-ticketbox-local-split-service-token-change-before-deploy}
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:-ticketbox-local-payment-service-token-change-before-deploy}
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:-ticketbox-local-notification-service-token-change-before-deploy}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:18091,http://127.0.0.1:18091}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m
      ARTIST_BIO_AI_PROVIDER: ${ARTIST_BIO_AI_PROVIDER:-mock}
      ARTIST_BIO_AI_API_KEY: ${ARTIST_BIO_AI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      ticketing-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  ticketing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketbox_ticketing
      POSTGRES_USER: ticketing_owner
      POSTGRES_PASSWORD: ticketing-owner-local-only
    volumes:
    - ticketing_data:/var/lib/postgresql/data
    - ./infra/postgres/ticketing-init.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ticketing_owner -d ticketbox_ticketing
      interval: 2s
      retries: 30
  checkin:
    image: ticketbox-checkin:local
    build:
      context: .
      dockerfile: services/checkin/Dockerfile
    cpus: 2
    mem_limit: 1200m
    stop_grace_period: 30s
    environment:
      DATABASE_URL: jdbc:postgresql://checkin-db:5432/ticketbox_checkin
      DATABASE_USER: checkin_runtime
      DATABASE_PASSWORD: checkin-runtime-local-only
      DATABASE_OWNER: checkin_owner
      DATABASE_OWNER_PASSWORD: checkin-owner-local-only
      JWT_SECRET: ${JWT_SECRET:-ticketbox-local-demo-secret-at-least-sixty-four-characters-change-before-deploy}
      SPLIT_SERVICE_TOKEN: ${SPLIT_SERVICE_TOKEN:-ticketbox-local-split-service-token-change-before-deploy}
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:-ticketbox-local-payment-service-token-change-before-deploy}
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:-ticketbox-local-notification-service-token-change-before-deploy}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:18091,http://127.0.0.1:18091}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m
      ARTIST_BIO_AI_PROVIDER: ${ARTIST_BIO_AI_PROVIDER:-mock}
      ARTIST_BIO_AI_API_KEY: ${ARTIST_BIO_AI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      checkin-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
    - checkin_artifacts:/app/data
    ports:
    - ${CHECKIN_BIND_ADDRESS:-127.0.0.1}:${CHECKIN_PORT:-18093}:8080
  checkin-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketbox_checkin
      POSTGRES_USER: checkin_owner
      POSTGRES_PASSWORD: checkin-owner-local-only
    volumes:
    - checkin_data:/var/lib/postgresql/data
    - ./infra/postgres/checkin-init.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U checkin_owner -d ticketbox_checkin
      interval: 2s
      retries: 30
volumes:
  core_data: null
  payment_data: null
  notification_data: null
  core_artifacts: null
  redis_data: null
  rabbit_data: null
  grafana_data: null
  identity_data: null
  catalog_artifacts: null
  catalog_data: null
  ticketing_data: null
  checkin_artifacts: null
  checkin_data: null
