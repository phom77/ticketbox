spring:
  messages:
    fallback-to-system-locale: false
  application:
    name: ticketbox-identity
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 8
  flyway:
    user: ${DATABASE_OWNER}
    password: ${DATABASE_OWNER_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
ticketbox:
  reset:
    key: ${PASSWORD_RESET_KEY:}
  security:
    jwt:
      secret: ${JWT_SECRET}
  web:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:18091}
split:
  token: ${SPLIT_SERVICE_TOKEN}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
