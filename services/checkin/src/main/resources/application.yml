spring:
  application:
    name: ticketbox-checkin
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 8
  flyway:
    user: ${DATABASE_OWNER}
    password: ${DATABASE_OWNER_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
ticketbox:
  security:
    jwt:
      secret: ${JWT_SECRET}
  web:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:18091}
  guest-list:
    root-dir: ${GUEST_LIST_ROOT_DIR:./data/guest-list}
    cron: ${GUEST_LIST_IMPORT_CRON:0 0 3 * * *}
    max-file-size: ${GUEST_LIST_MAX_FILE_SIZE:10MB}
    stable-age: ${GUEST_LIST_STABLE_AGE:30s}
split:
  token: ${SPLIT_SERVICE_TOKEN}
  ticketing-url: http://ticketing:8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
