events { worker_connections 1024; }
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $uri $support_lookup {
    default 0;
    /api/admin/orders/support 1;
    /api/organizer/manage/orders/support 1;
  }
  map $support_lookup $standard_access_log { 0 1; 1 0; }
  log_format support_safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 80;
    access_log /var/log/nginx/access.log combined if=$standard_access_log;
    access_log /var/log/nginx/access.log support_safe if=$support_lookup;
    root /usr/share/nginx/html;
    location ~ ^/(internal|actuator)(/|$) { return 404; }
    location /ws/ {
      set $upstream http://ticketing:8080;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 75s;
    }
    location ~ ^/api/(auth|users|organizations|admin/users|admin/organizations)(/|$) {
      set $upstream http://identity:8080;
      proxy_set_header X-TicketBox-Client-Ip $remote_addr;
      proxy_pass $upstream;
    }
    location ~ ^/api/(admin/)?notifications(/|$) {
      set $upstream http://notification:8080;
      proxy_pass $upstream;
    }
    location ~ ^/api/payments/webhooks/(vnpay|momo)$ {
      set $upstream http://payment:8080;
      proxy_pass $upstream;
    }
    location ~ ^/api/(staff/|(?:admin|organizer/manage)/(?:batch-logs|batch-jobs|concerts/[^/]+/(?:guest-lists|checkin-summary))) {
      set $upstream http://checkin:8080;
      proxy_pass $upstream;
    }
    location ~ ^/api/(admin|organizer/manage)/concerts/[^/]+/(tickets|orders|reminders/send)(/|$) {
      set $upstream http://ticketing:8080;
      proxy_pass $upstream;
    }
    location ~ ^/api/organizer/manage/(orders|tickets)(/|$) {
      set $upstream http://ticketing:8080;
      proxy_pass $upstream;
    }
    location ~ ^/api/(concerts|admin/concerts|admin/ticket-types|admin/artist-bio-jobs|organizer/manage)(/|$) {
      set $upstream http://catalog:8080;
      proxy_pass $upstream;
    }
    location /api/ {
      set $upstream http://ticketing:8080;
      proxy_pass $upstream;
    }
    location / { try_files $uri $uri/ /index.html; }
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
  }
}
