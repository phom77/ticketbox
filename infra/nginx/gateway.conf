events { worker_connections 1024; }
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 80;
    root /usr/share/nginx/html;
    location ~ ^/(internal|actuator)(/|$) { return 404; }
    location /ws/ {
      set $core http://core:8080;
      proxy_pass $core;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_connect_timeout 2s;
      proxy_read_timeout 75s;
    }
    location ~ ^/api/(admin/)?notifications(/|$) {
      set $notifications http://notification:8080;
      proxy_pass $notifications;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
    }
    location ~ ^/api/payments/webhooks/(vnpay|momo)$ {
      set $payments http://payment:8080;
      proxy_pass $payments;
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
    }
    location /api/ {
      set $core http://core:8080;
      proxy_pass $core;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
